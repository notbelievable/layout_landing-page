<!doctype html>
<html lang="en" class="page">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Landing Page</title>
    <link
      rel="stylesheet"
      href="src/styles/main.scss"
    />
    <script
      src="src/scripts/main.js"
      defer
    ></script>
    <link
      rel="icon"
      href="src/images/image 4.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Jura:wght@300..700&family=Roboto:ital,wght@0,500;1,500&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Jura:wght@300..700&family=Roboto:ital,wght@0,500;1,500&family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  </head>
  <!-- endregion -->
  <body class="page__body">

    <header class="header">
      <div class="top-bar">
        <a href="#" class="top-bar__logo">
          <img src="src/images/image 4.png" alt="logo">
        </a>
        <div class="top-bar__icons">
          <a href="tel:+1 234 5555-55-55" class="icon icon--phone"></a>
          <a href="#menu" class="icon icon--menu"></a>
        </div>
      </div>
      <div class="top-bar__bot">
        <h1 class="header__title">
          Bring joy back
          <br>
          to the everyday
        </h1>
      </div>
    </header>

    <aside class="aside aside__page" id="menu">
      <div class="top-bar aside__top">
        <a href="#" class="top-bar__logo">
          <img src="src/images/image 4.png" alt="logo">
        </a>
        <div class="aside__icon">
          <a href="#" class="icon icon--close"></a>
        </div>
      </div>

      <div class="aside__content">
        <nav class="nav">
          <ul class="nav__list">
            <li class="nav__item">
              <a class="nav__link" href="#products">Products</a>
            </li>
            <li class="nav__item">
              <a class="nav__link" href="#store">Store</a>
            </li>
            <li class="nav__item">
              <a class="nav__link" href="#login">Login</a>
            </li>
            <li class="nav__item">
              <a class="nav__link" href="#cart">Cart(0)</a>
            </li>
          </ul>
        </nav>
        <div class="aside__menu-contacts">
          <a class="aside__menu-contacts--phone" href="tel:+1 234 5555-55-55">+1 234 5555-55-55</a>
          <a class="aside__menu-contacts--call" href="tel:+1 234 5555-55-55">call to order</a>
        </div>
      </div>
    </aside>

    <main class="main">
      <section class="recommended" id="#recommended">
        <h2>Recommended</h2>
      </section>

      <section class="category" id="#browse">
        <h2>Browse Nothing products by category</h2>
      </section>

      <div class="image"></div>

      <section class="about-us" id="#about-us">
        <h2>About us</h2>
      </section>

      <section class="contact-us" id="#contact-us">
        <h2>Contact us</h2>
      </section>
    </main>
  </body>
</html>
